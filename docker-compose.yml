# Hostinger: build from public GitHub (no local Dockerfile needed on the VPS).
# App: http://<VPS-IP>:3000

services:
  fanduel-pace-totals:
    build:
      context: https://github.com/everworldlife-netizen/fanduel-pace-totals.git#main
      dockerfile: Dockerfile
    image: fanduel-pace-totals:v3
    container_name: fanduel-pace-totals
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      API_BASKETBALL_KEY: ${API_BASKETBALL_KEY:-}
      SKIP_NCAAB: ${SKIP_NCAAB:-0}
      FANDUEL_REGION: ${FANDUEL_REGION:-NJ}
